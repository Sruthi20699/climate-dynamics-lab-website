<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager | Dr. Abhishek Savita</title>
  <link rel="icon" type="image/jpeg" href="../images/occd-lab-logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* Re-theme Decap CMS's chrome to match the site's brand.
       Decap's internal styles are CSS-in-JS (emotion) with a hashed class
       prefix, but the descriptive component name survives as a stable
       substring (e.g. "css-a1b2c3-LoginButton") — matched here via
       attribute selectors so this keeps working across Decap version
       bumps even though the hash itself changes. !important is needed
       because emotion's own rules are injected with unpredictable order
       relative to this stylesheet. */
    #nc-root, body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #nc-root h1,
    #nc-root h2,
    #nc-root h3 {
      font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif !important;
    }

    /* Login screen */
    [class*="StyledAuthenticationPage"] {
      background: linear-gradient(135deg, #0F2C59 0%, #0A1F3F 100%) !important;
    }
    img[alt="Logo"] {
      max-width: 96px;
      max-height: 96px;
      border-radius: 18px;
    }
    [class*="IconWrapper-DecapLogoIcon"] svg {
      display: none;
    }
    [class*="LoginButton"] {
      background-color: #005691 !important;
      transition: background-color 0.2s ease-in-out;
    }
    [class*="LoginButton"]:hover {
      background-color: #2C7BB0 !important;
    }

    /* Top app header */
    header[class*="AppHeader"] {
      background-color: #0F2C59 !important;
    }
    [class*="AppHeaderLink"],
    [class*="AppHeaderButton"] {
      color: #FFFFFF !important;
    }

    /* Sidebar collection navigation */
    [class*="sidebarNavLinkActive"] {
      color: #005691 !important;
      border-color: #005691 !important;
    }
    [class*="SidebarNavLink"]:hover {
      color: #005691 !important;
    }

    /* Primary action buttons: New Entry, Publish, Save */
    [class*="ActionButton"],
    [class*="ResponsiveActionButton"] {
      background-color: #005691 !important;
      transition: background-color 0.2s ease-in-out;
    }
    [class*="ActionButton"]:hover,
    [class*="ResponsiveActionButton"]:hover {
      background-color: #2C7BB0 !important;
    }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Custom preview templates so editing publications, students, projects,
    // or courses shows something that actually resembles the live site
    // (real card/citation layout, real fonts and colors) instead of Decap's
    // generic default field dump. Written in plain ES5 + the classic
    // createClass/h globals Decap exposes, since there's no build step here.

    CMS.registerPreviewStyle('/css/style.css');
    CMS.registerPreviewStyle(
      '@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:wght@600;700&display=swap"); body { padding: 24px; background: #F8F9FA; }',
      { raw: true }
    );

    function renderBoldParts(text) {
      var parts = [];
      var regex = /\*\*(.+?)\*\*/g;
      var lastIndex = 0;
      var match;
      var i = 0;
      while ((match = regex.exec(text || ''))) {
        if (match.index > lastIndex) parts.push(text.slice(lastIndex, match.index));
        parts.push(h('strong', { key: 'b' + i++ }, match[1]));
        lastIndex = regex.lastIndex;
      }
      if (lastIndex < (text || '').length) parts.push(text.slice(lastIndex));
      return parts;
    }

    function renderPubList(pubs) {
      var byYear = {};
      pubs.forEach(function (p) {
        var y = p.year;
        if (!byYear[y]) byYear[y] = [];
        byYear[y].push(p);
      });
      var years = Object.keys(byYear).sort(function (a, b) { return b - a; });

      return years.map(function (year) {
        return h(
          'section',
          { className: 'pub-year', key: year },
          h('h2', {}, year),
          h(
            'ul',
            { className: 'pub-list' },
            byYear[year].map(function (pub, i) {
              var links = [];
              if (pub.doi_url) links.push(h('a', { key: 'd' }, 'DOI'));
              if (pub.pdf_url) links.push(h('a', { key: 'p' }, 'PDF'));
              var detail = pub.citation_detail ? ', ' + pub.citation_detail : '.';
              return h(
                'li',
                { className: 'pub-item', key: i },
                h(
                  'p',
                  { className: 'pub-citation' },
                  renderBoldParts(pub.authors),
                  ' (' + pub.year + '). ' + (pub.title || '') + ' ',
                  h('em', {}, pub.journal || ''),
                  detail
                ),
                links.length ? h('div', { className: 'pub-links' }, links) : null
              );
            })
          )
        );
      });
    }

    var PublicationsPreview = createClass({
      render: function () {
        var data = this.props.entry.get('data');
        var papers = data.get('papers') ? data.get('papers').toJS() : [];
        var datasets = data.get('datasets') ? data.get('datasets').toJS() : [];

        return h(
          'div',
          { className: 'container' },
          renderPubList(papers),
          datasets.length
            ? h(
                'section',
                { className: 'team-section' },
                h('div', { className: 'section-heading' }, h('h2', {}, 'Datasets')),
                renderPubList(datasets)
              )
            : null
        );
      }
    });

    function renderNameDetailList(items) {
      return h(
        'ul',
        { className: 'alumni-list' },
        items.map(function (a, i) {
          return h('li', { key: i }, h('span', { className: 'alumni-name' }, a.name), h('span', { className: 'alumni-detail' }, a.detail));
        })
      );
    }

    var StudentsPreview = createClass({
      render: function () {
        var data = this.props.entry.get('data');
        var groups = [
          ['phdStudents', 'Ph.D. Students'],
          ['mtechStudents', 'M.Tech. Students'],
          ['masterStudents', 'Master Students'],
          ['bachelorStudents', 'Bachelor Students']
        ];

        return h(
          'div',
          { className: 'container' },
          groups.map(function (g) {
            var items = data.get(g[0]) ? data.get(g[0]).toJS() : [];
            return h(
              'section',
              { className: 'alumni-section', key: g[0] },
              h('div', { className: 'section-heading' }, h('h2', {}, g[1])),
              items.length ? renderNameDetailList(items) : h('p', {}, 'Coming soon …')
            );
          })
        );
      }
    });

    var ProjectsPreview = createClass({
      render: function () {
        var data = this.props.entry.get('data');
        var projects = data.get('projects') ? data.get('projects').toJS() : [];

        return h(
          'div',
          { className: 'container' },
          h(
            'section',
            { className: 'funding-section' },
            h('div', { className: 'section-heading' }, h('h2', {}, 'Sponsored Research Projects')),
            projects.length
              ? h(
                  'ul',
                  { className: 'funding-list' },
                  projects.map(function (p, i) {
                    return h(
                      'li',
                      { key: i },
                      h('div', { className: 'funding-title' }, p.title),
                      h('div', { className: 'funding-meta' }, [p.agency, p.duration].filter(Boolean).join(' · '))
                    );
                  })
                )
              : h('p', {}, 'Coming soon …')
          )
        );
      }
    });

    var CoursesPreview = createClass({
      render: function () {
        var data = this.props.entry.get('data');
        var groups = [
          ['postgraduate', 'Postgraduate Courses'],
          ['undergraduate', 'Undergraduate Courses']
        ];

        return h(
          'div',
          { className: 'container' },
          groups.map(function (g) {
            var items = data.get(g[0]) ? data.get(g[0]).toJS() : [];
            return h(
              'section',
              { className: 'funding-section', key: g[0] },
              h('div', { className: 'section-heading' }, h('h2', {}, g[1])),
              items.length
                ? h(
                    'ul',
                    { className: 'funding-list' },
                    items.map(function (c, i) {
                      return h(
                        'li',
                        { key: i },
                        h('div', { className: 'funding-title' }, (c.code ? c.code + ' — ' : '') + (c.name || '')),
                        h('div', { className: 'funding-meta' }, c.semester || '')
                      );
                    })
                  )
                : h('p', {}, 'Coming soon …')
            );
          })
        );
      }
    });

    CMS.registerPreviewTemplate('publications-list', PublicationsPreview);
    CMS.registerPreviewTemplate('students-list', StudentsPreview);
    CMS.registerPreviewTemplate('projects-list', ProjectsPreview);
    CMS.registerPreviewTemplate('courses-list', CoursesPreview);
  </script>
</body>
</html>
