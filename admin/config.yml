backend:
  name: github
  repo: Sruthi20699/climate-dynamics-lab-website
  branch: main
  base_url: https://climate-dynamics-lab-website.netlify.app
  auth_endpoint: .netlify/functions/auth

logo_url: "/images/lab-logo.svg"
site_url: "https://climate-dynamics-lab-website.netlify.app"
display_url: "https://climate-dynamics-lab-website.netlify.app"

media_folder: "images/uploads"
public_folder: "images/uploads"

collections:
  - name: "home"
    label: "Home Page"
    files:
      - name: "home-content"
        label: "Home Page Content"
        file: "data/home.json"
        fields:
          - label: "Photo"
            name: "photo"
            widget: "image"
            required: false
            hint: "Leave blank to use a default illustration"
          - { label: "Current Position", name: "position", widget: "string" }
          - { label: "Bio", name: "bio", widget: "text" }
          - label: "Research Focus"
            name: "researchFocus"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - { label: "Research Opportunities Statement", name: "recruitingStatement", widget: "text" }
          - { label: "Recruiting Contact Email", name: "recruitingEmail", widget: "string" }
          - { label: "Google Scholar URL", name: "scholarUrl", widget: "string", required: false }
          - { label: "ResearchGate URL", name: "researchgateUrl", widget: "string", required: false }

  - name: "biosketch"
    label: "Bio-Sketch"
    files:
      - name: "biosketch-content"
        label: "Bio-Sketch Content"
        file: "data/biosketch.json"
        fields:
          - { label: "Current Position", name: "currentPosition", widget: "string" }
          - label: "Education"
            name: "education"
            widget: "list"
            field: { label: "Entry", name: "entry", widget: "string" }
          - label: "Professional Experience"
            name: "experience"
            widget: "list"
            field: { label: "Entry", name: "entry", widget: "string" }
          - { label: "IPCC Contribution", name: "ipccLine", widget: "text" }
          - label: "Awards & Recognition"
            name: "awards"
            widget: "list"
            field: { label: "Entry", name: "entry", widget: "string" }
          - label: "Professional Contributions"
            name: "contributions"
            widget: "list"
            field: { label: "Entry", name: "entry", widget: "string" }
          - label: "Talks & Presentations"
            name: "talks"
            widget: "list"
            field: { label: "Entry", name: "entry", widget: "string" }

  - name: "publications"
    label: "Publications"
    files:
      - name: "publications-list"
        label: "Publications & Datasets"
        file: "data/publications.json"
        fields:
          - label: "Papers"
            name: "papers"
            widget: "list"
            summary: "{{fields.year}} — {{fields.title}}"
            fields: &pub_fields
              - { label: "Year", name: "year", widget: "number", value_type: "int" }
              - label: "Authors"
                name: "authors"
                widget: "string"
                hint: "Wrap your own name in double asterisks to bold it, e.g. **Abhishek Savita**"
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Journal / Source", name: "journal", widget: "string" }
              - label: "Citation Detail"
                name: "citation_detail"
                widget: "string"
                required: false
                hint: "Volume, issue, and pages as they should appear, e.g. 39(4), 1123–1140."
              - { label: "DOI / Link", name: "doi_url", widget: "string", required: false }
              - { label: "PDF Link", name: "pdf_url", widget: "string", required: false }
          - label: "Datasets"
            name: "datasets"
            widget: "list"
            summary: "{{fields.year}} — {{fields.title}}"
            fields: *pub_fields

  - name: "projects"
    label: "Projects"
    files:
      - name: "projects-list"
        label: "Sponsored Research Projects"
        file: "data/projects.json"
        fields:
          - label: "Projects"
            name: "projects"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Funding Agency", name: "agency", widget: "string" }
              - { label: "Duration", name: "duration", widget: "string", hint: "e.g. 2026–2029" }

  - name: "students"
    label: "Students"
    files:
      - name: "students-list"
        label: "Students"
        file: "data/students.json"
        fields:
          - label: "PhD Students"
            name: "phdStudents"
            widget: "list"
            summary: "{{name}}"
            fields: &student_fields
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Detail", name: "detail", widget: "string", hint: "e.g. PhD Student, 2nd Year" }
          - label: "M.Tech Students"
            name: "mtechStudents"
            widget: "list"
            summary: "{{name}}"
            fields: *student_fields
          - label: "Master Students"
            name: "masterStudents"
            widget: "list"
            summary: "{{name}}"
            fields: *student_fields
          - label: "Bachelor Students"
            name: "bachelorStudents"
            widget: "list"
            summary: "{{name}}"
            fields: *student_fields

  - name: "courses"
    label: "Courses"
    files:
      - name: "courses-list"
        label: "Courses"
        file: "data/courses.json"
        fields:
          - label: "Postgraduate Courses"
            name: "postgraduate"
            widget: "list"
            summary: "{{code}} — {{name}}"
            fields: &course_fields
              - { label: "Course Code", name: "code", widget: "string", required: false }
              - { label: "Course Name", name: "name", widget: "string" }
              - { label: "Semester", name: "semester", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text", required: false }
          - label: "Undergraduate Courses"
            name: "undergraduate"
            widget: "list"
            summary: "{{code}} — {{name}}"
            fields: *course_fields

  - name: "contact"
    label: "Contact Info"
    files:
      - name: "contact-info"
        label: "Contact Info"
        file: "data/contact.json"
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Department", name: "department", widget: "string" }
          - { label: "Institution", name: "institution", widget: "string" }
          - { label: "Address", name: "address", widget: "text", hint: "e.g. Hauz Khas New Delhi 110016, Indian" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Tel", name: "phone", widget: "string" }
          - { label: "Office Location", name: "office", widget: "string" }
