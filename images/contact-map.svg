<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 360" role="img" aria-label="Stylized map showing the location of Science Hall on Northfield University's campus">
  <defs>
    <linearGradient id="mapbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF2F6"/>
      <stop offset="100%" stop-color="#E4EAF0"/>
    </linearGradient>
  </defs>
  <rect width="1180" height="360" fill="url(#mapbg)"/>

  <!-- roads -->
  <g stroke="#C7D2DC" stroke-width="14" fill="none">
    <path d="M0,120 C250,90 450,150 700,110 C900,80 1050,130 1180,100"/>
    <path d="M180,0 C220,120 200,240 250,360"/>
    <path d="M820,0 C780,140 830,240 800,360"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="2" stroke-dasharray="10 10" fill="none">
    <path d="M0,120 C250,90 450,150 700,110 C900,80 1050,130 1180,100"/>
    <path d="M180,0 C220,120 200,240 250,360"/>
    <path d="M820,0 C780,140 830,240 800,360"/>
  </g>

  <!-- green quad -->
  <ellipse cx="590" cy="215" rx="150" ry="90" fill="#CFE3D4"/>

  <!-- campus buildings -->
  <g stroke="#0F2C59" stroke-width="1.5">
    <rect x="90" y="150" width="90" height="60" rx="3" fill="#FFFFFF"/>
    <rect x="300" y="60" width="110" height="70" rx="3" fill="#FFFFFF"/>
    <rect x="470" y="230" width="100" height="65" rx="3" fill="#FFFFFF"/>
    <rect x="860" y="150" width="100" height="70" rx="3" fill="#FFFFFF"/>
    <rect x="960" y="240" width="90" height="60" rx="3" fill="#FFFFFF"/>
    <rect x="700" y="70" width="120" height="80" rx="3" fill="#0F2C59"/>
  </g>
  <text x="760" y="115" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Science Hall</text>

  <!-- location pin -->
  <g transform="translate(760,150)">
    <path d="M0,0 C-20,0 -34,14 -34,34 C-34,58 0,90 0,90 C0,90 34,58 34,34 C34,14 20,0 0,0 Z" fill="#005691"/>
    <circle cx="0" cy="32" r="12" fill="#FFFFFF"/>
  </g>

  <!-- compass -->
  <g transform="translate(1110,60)" stroke="#0F2C59" stroke-width="2" fill="none">
    <circle r="28"/>
    <path d="M0,-20 L6,0 L0,20 L-6,0 Z" fill="#005691" stroke="none"/>
    <text y="-34" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F2C59" text-anchor="middle" stroke="none">N</text>
  </g>
</svg>
