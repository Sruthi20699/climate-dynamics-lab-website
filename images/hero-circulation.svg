<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="globeFill" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#2C7BB0"/>
      <stop offset="55%" stop-color="#0F2C59"/>
      <stop offset="100%" stop-color="#0A1F3F"/>
    </radialGradient>
    <linearGradient id="jetStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9FC1E0" stop-opacity="0"/>
      <stop offset="20%" stop-color="#9FC1E0"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="80%" stop-color="#9FC1E0"/>
      <stop offset="100%" stop-color="#9FC1E0" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="globeClip">
      <circle cx="240" cy="240" r="130"/>
    </clipPath>
    <style>
      .ring-outer, .ring-mid { transform-box: fill-box; transform-origin: center; }
      .ring-outer { animation: spin 100s linear infinite; }
      .ring-mid { animation: spin-reverse 65s linear infinite; }
      .satellite { animation: pulse 3.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .satellite.d2 { animation-delay: 1.1s; }
      .satellite.d3 { animation-delay: 2.2s; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes spin-reverse { to { transform: rotate(-360deg); } }
      @keyframes pulse {
        0%, 100% { opacity: 0.55; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.35); }
      }
      @media (prefers-reduced-motion: reduce) {
        .ring-outer, .ring-mid, .satellite { animation: none; }
      }
    </style>
  </defs>

  <circle class="ring-outer" cx="240" cy="240" r="228" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="6 16"/>
  <circle class="ring-mid" cx="240" cy="240" r="185" fill="none" stroke="#9FC1E0" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 12"/>

  <circle cx="240" cy="240" r="130" fill="url(#globeFill)"/>

  <g clip-path="url(#globeClip)">
    <path d="M110,300 C160,280 190,320 240,300 C290,280 320,320 370,302 L370,370 L110,370 Z" fill="#005691" opacity="0.55"/>
    <path d="M110,320 C160,304 190,336 240,320 C290,304 320,336 370,322 L370,370 L110,370 Z" fill="#2C7BB0" opacity="0.55"/>
    <g stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1" fill="none">
      <ellipse cx="240" cy="240" rx="130" ry="48"/>
      <ellipse cx="240" cy="240" rx="130" ry="95"/>
      <line x1="110" y1="240" x2="370" y2="240"/>
      <line x1="240" y1="110" x2="240" y2="370"/>
      <line x1="163" y1="140" x2="163" y2="340"/>
      <line x1="317" y1="140" x2="317" y2="340"/>
    </g>
  </g>
  <circle cx="240" cy="240" r="130" fill="none" stroke="#9FC1E0" stroke-opacity="0.45" stroke-width="1.5"/>

  <path d="M60,205 C120,150 175,255 240,205 C305,155 360,245 420,200"
        fill="none" stroke="url(#jetStroke)" stroke-width="7" stroke-linecap="round"/>

  <g fill="#FFFFFF">
    <circle class="satellite d1" cx="405" cy="150" r="5"/>
    <circle class="satellite d2" cx="88" cy="330" r="4"/>
    <circle class="satellite d3" cx="360" cy="365" r="4.5"/>
  </g>
</svg>
